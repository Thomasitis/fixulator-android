name: Build Fixulator APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with libjamesdsp submodule)
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Signing key (stable, so updates install over the old version)
        env:
          KS: ${{ secrets.FX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > $RUNNER_TEMP/fixulator.jks
            echo "FX_KEYSTORE=$RUNNER_TEMP/fixulator.jks" >> $GITHUB_ENV
          else
            echo "No signing secret: using a throwaway debug key"
          fi

      - name: Build
        uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon assembleRootlessFdroidRelease
        env:
          FX_KEYSTORE_PASSWORD: ${{ secrets.FX_KEYSTORE_PASSWORD }}
          FX_KEY_ALIAS: ${{ secrets.FX_KEY_ALIAS }}
          FX_KEY_PASSWORD: ${{ secrets.FX_KEY_PASSWORD }}

      - name: Collect APK
        run: |
          set -e
          ls -l app/build/outputs/apk/rootlessFdroid/release/
          APK=$(ls app/build/outputs/apk/rootlessFdroid/release/*universal*.apk 2>/dev/null | head -1)
          [ -z "$APK" ] && APK=$(ls app/build/outputs/apk/rootlessFdroid/release/*.apk | head -1)
          cp "$APK" Fixulator.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fixulator-apk
          path: Fixulator.apk

      - name: Publish as "latest" release (easy download on the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Fixulator (latest build)
          prerelease: true
          make_latest: false
          body: "Built from ${{ github.sha }}. Download Fixulator.apk on your phone and install."
          files: Fixulator.apk
